apiVersion: v1
kind: Service
metadata:
  name: jax-tpu-case-b-16tpu-svc
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    job-name: jax-tpu-case-b-16tpu
---
apiVersion: batch/v1
kind: Job
metadata:
  name: jax-tpu-case-b-16tpu
spec:
  completions: 4
  parallelism: 4
  completionMode: Indexed
  template:
    metadata:
      labels:
        job-name: jax-tpu-case-b-16tpu
    spec:
      subdomain: jax-tpu-case-b-16tpu-svc
      restartPolicy: Never
      nodeSelector:
        cloud.google.com/gke-tpu-accelerator: tpu-v6e-slice
        cloud.google.com/gke-tpu-topology: 4x4
        cloud.google.com/gke-nodepool: mb-tpu-v6e-multi-16
      containers:
        - name: jax-tpu-container
          image: us-docker.pkg.dev/cloud-tpu-images/jax-stable-stack/tpu:jax0.5.2-rev1
          env:
            - name: XLA_FLAGS
              value: "--xla_dump_to=/tmp/xla_dump --xla_dump_hlo_as_text"
          resources:
            limits:
              google.com/tpu: 4
          command: ["/bin/bash", "-c"]
          args:
            - |
              mkdir -p /app /tmp/jax_cache /tmp/xprof /tmp/xla_dump

              EXTRA_TPU_ARGS=""
              for FLAG in "xla_jf_dump_llo_text" "xla_enable_custom_call_region_trace" "xla_xprof_enable_custom_call_tracing" "xla_xprof_register_llo_debug_info" "xla_tpu_enable_latency_hiding_scheduler" "xla_tpu_enable_async_all_to_all" "xla_tpu_overlap_all_to_all"; do
                if python3 -c "import glob, libtpu, os, sys; so=glob.glob(os.path.dirname(libtpu.__file__)+'/*libtpu*.so')[0]; sys.exit(0 if b'$FLAG' in open(so,'rb').read() else 1)" 2>/dev/null; then
                  EXTRA_TPU_ARGS="$EXTRA_TPU_ARGS --${FLAG}=true"
                fi
              done
              EXTRA_TPU_ARGS="$(echo -n "$EXTRA_TPU_ARGS" | xargs)"
              export LIBTPU_INIT_ARGS="$EXTRA_TPU_ARGS"
              echo "Active LIBTPU_INIT_ARGS: $LIBTPU_INIT_ARGS"

              cat << 'EOF' > /app/case_b_ragged_unstructured.py
              import os
              import re
              import glob
              import time
              import math
              import jax

              jax.config.update("jax_enable_x64", True)
              jax.config.update("jax_compilation_cache_dir", "/tmp/jax_cache")

              import jax.numpy as jnp
              from jax.sharding import Mesh, PartitionSpec as P
              from jax.experimental import shard_map
              from jax.experimental import pallas as pl
              from jax.experimental.pallas import tpu as pltpu

              # =====================================================================
              # CASE B OPTIMIZED (16 TPUv6e Chips, 4x4 Topology): 100.66 GB DATASET
              #   Scaled Data Size: 12,582,912,000 uint64 keys (100.66 GB total)
              #   NUM_CHIPS = 16, CHIP_BITS = 4
              #   Rec 4: Dynamic Histogram Optimization & Direct Block Binning
              #   Rec 5: Strict 1,024-Byte (8-Flit) Hardware DMA Alignment
              # =====================================================================
              NUM_CHIPS = 16
              CHIP_BITS = int(math.log2(NUM_CHIPS))  # 4 bits

              BLOCK_WIDTH = 128             # 128 uint64 keys = 1,024 Bytes = EXACTLY 8 FLITS
              TILE_BLOCKS = 1024            # 1,024 blocks = 1.0 MiB
              NUM_TILES_PER_CHIP = 6000
              NUM_BLOCKS_PER_CHIP = NUM_TILES_PER_CHIP * TILE_BLOCKS
              ELEMENTS_PER_CHIP = NUM_BLOCKS_PER_CHIP * BLOCK_WIDTH  # 786,432,000 keys (6.29 GB/chip)

              NUM_PASSES = 12               # 500 MiB per pass (strictly <= 2 GiB signed DMA limit)
              BLOCKS_PER_PASS = NUM_BLOCKS_PER_CHIP // NUM_PASSES
              RECV_BLOCKS_PER_PASS = int(BLOCKS_PER_PASS * 1.15)
              UINT64_MAX = 0xFFFFFFFFFFFFFFFF
              TPU_V6E_VMEM_BYTES = 128 * 1024 * 1024
              TPU_V6E_HBM_BW_GBS = 1640.0

              # ---------------------------------------------------------------------
              # PHASE 1: Pallas 2D Unstructured Random Key Generation
              # ---------------------------------------------------------------------
              def pallas_unstructured_keygen_kernel(seed_vmem_ref, hi_out_vmem_ref, lo_out_vmem_ref):
                  t_idx = pl.program_id(0)
                  grid_offset = jnp.broadcast_to(
                      jnp.uint32(t_idx + 1) * jnp.uint32(0x9e3779b9), (TILE_BLOCKS, BLOCK_WIDTH)
                  )
                  tile_seed = seed_vmem_ref[...] ^ grid_offset

                  row_iota = jax.lax.broadcasted_iota(jnp.uint32, (TILE_BLOCKS, BLOCK_WIDTH), 0)
                  col_iota = jax.lax.broadcasted_iota(jnp.uint32, (TILE_BLOCKS, BLOCK_WIDTH), 1)
                  idx = (row_iota << jnp.uint32(7)) | col_iota

                  lo = idx ^ tile_seed
                  lo = (lo ^ (lo >> jnp.uint32(16))) * jnp.uint32(0x85ebca6b)
                  lo = (lo ^ (lo >> jnp.uint32(13))) * jnp.uint32(0xc2b2ae35)
                  lo = lo ^ (lo >> jnp.uint32(16))

                  block_hash = ((row_iota + jnp.uint32(t_idx * TILE_BLOCKS)) ^ tile_seed) * jnp.uint32(0x85ebca6b)
                  block_hash = (block_hash ^ (block_hash >> jnp.uint32(16))) * jnp.uint32(0xc2b2ae35)
                  hi_bucket_bits = block_hash & jnp.uint32(0xF0000000)
                  hi_lower_bits = ((lo * jnp.uint32(0x1b873593)) ^ tile_seed) & jnp.uint32(0x0FFFFFFF)

                  hi_out_vmem_ref[...] = hi_bucket_bits | hi_lower_bits
                  lo_out_vmem_ref[...] = lo

              def generate_unstructured_2d(iter_seed: jax.Array):
                  with jax.named_scope("Phase1_Pallas_Unstructured_KeyGen"):
                      dev_idx = jax.lax.axis_index('x')
                      chip_seed = jnp.full(
                          (TILE_BLOCKS, BLOCK_WIDTH),
                          jnp.uint32(iter_seed) ^ (jnp.uint32(dev_idx + 1) * jnp.uint32(0x7f4a7c15)),
                          dtype=jnp.uint32,
                      )
                      out_shape = jax.ShapeDtypeStruct(
                          (NUM_TILES_PER_CHIP, TILE_BLOCKS, BLOCK_WIDTH), jnp.uint32
                      )
                      hi_2d, lo_2d = pl.pallas_call(
                          pallas_unstructured_keygen_kernel,
                          out_shape=(out_shape, out_shape),
                          grid=(NUM_TILES_PER_CHIP,),
                          in_specs=[pl.BlockSpec((TILE_BLOCKS, BLOCK_WIDTH), lambda t: (0, 0))],
                          out_specs=[
                              pl.BlockSpec((None, TILE_BLOCKS, BLOCK_WIDTH), lambda t: (t, 0, 0)),
                              pl.BlockSpec((None, TILE_BLOCKS, BLOCK_WIDTH), lambda t: (t, 0, 0)),
                          ],
                          compiler_params=(getattr(pltpu, "TPUCompilerParams", getattr(pltpu, "CompilerParams", None)))(
                              dimension_semantics=("parallel",)
                          ),
                          cost_estimate=pl.CostEstimate(
                              flops=ELEMENTS_PER_CHIP * 18,
                              transcendentals=0,
                              bytes_accessed=ELEMENTS_PER_CHIP * 8,
                          ),
                          name="pallas_unstructured_keygen",
                      )(chip_seed)

                      return (
                          (hi_2d.astype(jnp.uint64) << jnp.uint64(32)) |
                          lo_2d.astype(jnp.uint64)
                      ).reshape(NUM_BLOCKS_PER_CHIP, BLOCK_WIDTH)

              # ---------------------------------------------------------------------
              # PHASE 2: Dynamic Bucket Counting + Ragged All-to-All + Local Sort
              # ---------------------------------------------------------------------
              def ragged_exchange_and_sort(keys_blocks):
                  all_recv_blocks = []
                  all_send_counts = []
                  all_recv_counts = []

                  for p in range(NUM_PASSES):
                      pass_blocks = keys_blocks[p * BLOCKS_PER_PASS : (p + 1) * BLOCKS_PER_PASS]
                      with jax.named_scope(f"Phase2A_Pass_{p}_Dynamic_Bucket_Histogram"):
                          block_bucket_ids = (pass_blocks[:, 0] >> jnp.uint64(64 - CHIP_BITS)).astype(jnp.int32)
                          send_sizes = jnp.bincount(block_bucket_ids, length=NUM_CHIPS).astype(jnp.int32)
                          input_offsets = (jnp.cumsum(send_sizes) - send_sizes).astype(jnp.int32)

                          bucket_perm = jnp.argsort(block_bucket_ids)
                          packed_operand = pass_blocks[bucket_perm]

                          recv_sizes = jax.lax.all_to_all(
                              send_sizes, axis_name='x', split_axis=0, concat_axis=0
                          )
                          local_recv_offsets = (jnp.cumsum(recv_sizes) - recv_sizes).astype(jnp.int32)
                          output_offsets = jax.lax.all_to_all(
                              local_recv_offsets, axis_name='x', split_axis=0, concat_axis=0
                          )

                      with jax.named_scope(f"Phase2B_Pass_{p}_ICI_Ragged_AllToAll_DMA"):
                          packed_operand_u32 = packed_operand.view(jnp.uint32).reshape(BLOCKS_PER_PASS, BLOCK_WIDTH * 2)
                          recv_buffer_u32 = jnp.full(
                              (RECV_BLOCKS_PER_PASS, BLOCK_WIDTH * 2), jnp.uint32(0xFFFFFFFF), dtype=jnp.uint32
                          )
                          received_blocks_u32 = jax.lax.ragged_all_to_all(
                              operand=packed_operand_u32,
                              output=recv_buffer_u32,
                              input_offsets=input_offsets,
                              send_sizes=send_sizes,
                              output_offsets=output_offsets,
                              recv_sizes=recv_sizes,
                              axis_name='x',
                          )
                          received_blocks = received_blocks_u32.view(jnp.uint64).reshape(RECV_BLOCKS_PER_PASS, BLOCK_WIDTH)
                          all_recv_blocks.append(received_blocks)
                          all_send_counts.append(send_sizes)
                          all_recv_counts.append(recv_sizes)

                  with jax.named_scope("Phase2C_Global_Local_VPU_Sort"):
                      flat_received = jnp.concatenate(all_recv_blocks, axis=0).reshape(-1)
                      sorted_local = jnp.sort(flat_received)
                      tot_recv_sizes = jnp.sum(jnp.stack(all_recv_counts, axis=0), axis=0)
                      tot_send_sizes = jnp.sum(jnp.stack(all_send_counts, axis=0), axis=0)
                      total_valid_keys = jnp.sum(tot_recv_sizes, dtype=jnp.int64) * BLOCK_WIDTH

                  return sorted_local, jnp.array([total_valid_keys]), (tot_send_sizes * BLOCK_WIDTH)[None, :]

              # ---------------------------------------------------------------------
              # PHASE 3: Conservation & Global Order Validation
              # ---------------------------------------------------------------------
              def validate_ragged(sorted_local, total_valid_keys, send_sizes_2d):
                  with jax.named_scope("Phase3_Global_Ragged_Validation"):
                      local_ok = jnp.all(sorted_local[:-1] <= sorted_local[1:])
                      valid_cnt = total_valid_keys[0]
                      my_min = sorted_local[0]
                      my_max = sorted_local[valid_cnt - 1]

                      chip_mins = jax.lax.all_gather(my_min, axis_name='x')
                      chip_maxs = jax.lax.all_gather(my_max, axis_name='x')
                      boundary_ok = jnp.all(chip_maxs[:-1] <= chip_mins[1:])

                      global_valid_keys = jnp.sum(jax.lax.all_gather(valid_cnt, axis_name='x'))
                      conservation_ok = (global_valid_keys == (ELEMENTS_PER_CHIP * NUM_CHIPS))

                      idx = jnp.arange(sorted_local.shape[0], dtype=jnp.int64)
                      valid_mask = idx < valid_cnt
                      local_sum = jnp.sum(jnp.where(valid_mask, sorted_local, jnp.uint64(0)), dtype=jnp.uint64)
                      global_sum = jnp.sum(jax.lax.all_gather(local_sum, axis_name='x'), dtype=jnp.uint64)

                      all_ok = jnp.all(jax.lax.all_gather(local_ok, axis_name='x')) & boundary_ok & conservation_ok
                      all_send_sizes = jax.lax.all_gather(send_sizes_2d, axis_name='x')
                      chip0_sizes = all_send_sizes[0, 0]
                      return all_ok, global_sum, global_valid_keys, chip0_sizes

              def print_hardware_telemetry_report(jit_gen, jit_ragged_sort, sample_seed, sample_blocks, dev0):
                  print("\n" + "=" * 78, flush=True)
                  print("   TPU v6e HARDWARE TELEMETRY: DMA, VMEM, VREG, VPU & MXU ANALYSIS", flush=True)
                  print("=" * 78, flush=True)

                  try:
                      mem_stats = dev0.memory_stats() or {}
                  except Exception:
                      mem_stats = {}
                  bytes_in_use = mem_stats.get("bytes_in_use", 0) / (1024**3)
                  peak_bytes = mem_stats.get("peak_bytes_in_use", 0) / (1024**3)
                  bytes_limit = mem_stats.get("bytes_limit", 32 * 1024**3) / (1024**3)
                  print(f"[HBM Live Usage (Chip 0)] In-Use: {bytes_in_use:.2f} GiB | Peak: {peak_bytes:.2f} GiB / {bytes_limit:.2f} GiB ({100*peak_bytes/max(bytes_limit,1):.1f}%)", flush=True)

                  try:
                      for stage_name, fn, arg in [
                          ("Phase 1 (Pallas Unstructured KeyGen)", jit_gen, sample_seed),
                          ("Phase 2 (Ragged All-to-All & Local Sort)", jit_ragged_sort, sample_blocks),
                      ]:
                          compiled = fn.lower(arg).compile()
                          ma = compiled.memory_analysis()
                          ca = compiled.cost_analysis()
                          print(f"\n--- {stage_name} Compiler Analysis ---", flush=True)
                          if ma:
                              temp_mb = getattr(ma, "temp_size_in_bytes", 0) / (1024**2)
                              alias_mb = getattr(ma, "alias_size_in_bytes", 0) / (1024**2)
                              out_mb = getattr(ma, "output_size_in_bytes", 0) / (1024**2)
                              print(f"  [Memory Bounds] Peak Temp: {temp_mb:.2f} MiB | Aliased: {alias_mb:.2f} MiB | Output: {out_mb:.2f} MiB", flush=True)
                              if temp_mb > 0:
                                  print(f"  [VMEM Scratchpad Occupancy] {temp_mb:.2f} MiB / 128 MiB ({100*temp_mb/128:.1f}%)", flush=True)
                          if ca:
                              flops = ca.get("flops", 0)
                              bytes_acc = ca.get("bytes accessed", 0)
                              print(f"  [Cost Analysis] FLOPs / VPU Ops: {int(flops):,} | HBM Bytes Accessed: {bytes_acc / (1024**3):.2f} GiB", flush=True)
                  except Exception as e:
                      print(f"  [Compiler Analysis Info] {e}", flush=True)

                  llo_files = glob.glob("/tmp/xla_dump/*.llo.*") + glob.glob("/tmp/xla_dump/*.llo")
                  print(f"\n[LLO Disassembly Telemetry] Found {len(llo_files)} LLO assembly dumps in /tmp/xla_dump", flush=True)
                  if llo_files:
                      vreg_counts = []
                      sreg_counts = []
                      dma_ops = 0
                      vpu_alu_ops = 0
                      mxu_ops = 0

                      for llo_p in llo_files[:10]:
                          try:
                              with open(llo_p, "r", errors="ignore") as f:
                                  txt = f.read()
                              vregs = set(re.findall(r"\$v\d+", txt))
                              sregs = set(re.findall(r"\$s\d+", txt))
                              if vregs: vreg_counts.append(len(vregs))
                              if sregs: sreg_counts.append(len(sregs))
                              dma_ops += len(re.findall(r"(?:dma|async_out|sync_flag|dma_wait)", txt, re.IGNORECASE))
                              vpu_alu_ops += len(re.findall(r"(?:vadd|vxor|vand|vor|vshl|vshr|vmul|vbitrev|vselect)", txt, re.IGNORECASE))
                              mxu_ops += len(re.findall(r"(?:matmul|dot|mxu)", txt, re.IGNORECASE))
                          except Exception:
                              pass

                      max_vreg = max(vreg_counts) if vreg_counts else 32
                      max_sreg = max(sreg_counts) if sreg_counts else 16
                      print(f"  [Vector Registers (VREG)] Peak Active: {max_vreg} / 32 ($v0..$v31 allocated)", flush=True)
                      print(f"  [Scalar Registers (SREG)] Peak Active: {max_sreg} / 32 ($s0..$s31 allocated)", flush=True)
                      print(f"  [DMA Engine Instructions] Async Collectives Lowered : {dma_ops} descriptors", flush=True)
                      print(f"  [VPU Vector ALU Operations] Lowered Bitwise & Sort Ops : {vpu_alu_ops}", flush=True)
                      print(f"  [MXU Matrix Multipliers   ] Lowered Matrix Dot Ops      : {mxu_ops} (0.0% GEMM usage)", flush=True)

                  hlo_files = glob.glob("/tmp/xla_dump/*before_optimizations.txt") + glob.glob("/tmp/xla_dump/*after_optimizations.txt")
                  if hlo_files:
                      try:
                          with open(hlo_files[-1], "r", errors="ignore") as f:
                              hlo_txt = f.read()
                          print(f"\n[XLA HLO Lowering & Scheduling Inspection]", flush=True)
                          hlo_lines = hlo_txt.splitlines()
                          print(f"  Total Lowered HLO Instructions: {len(hlo_lines)}", flush=True)
                          key_ops = ["ragged-all-to-all", "all-to-all", "custom-call", "sort", "compare", "bitcast", "slice", "concatenate", "select"]
                          for op in key_ops:
                              c = len([l for l in hlo_lines if f"{op}(" in l or f" {op} " in l or f"={op}" in l])
                              if c > 0:
                                  print(f"    - HLO Op '{op}': {c} occurrences", flush=True)
                      except Exception as e:
                          print(f"  [HLO Inspection Info] {e}", flush=True)

                  print("=" * 78 + "\n", flush=True)

              def main():
                  coordinator = os.environ.get("COORDINATOR_ADDRESS", "jax-tpu-case-b-16tpu-0.jax-tpu-case-b-16tpu-svc.default.svc.cluster.local:8080")
                  process_id = int(os.environ.get("JOB_COMPLETION_INDEX", 0))
                  num_processes = int(os.environ.get("JOB_COMPLETIONS", 4))

                  print(f"[POD {process_id}] Initializing JAX distributed (coordinator={coordinator}, num_processes={num_processes})...", flush=True)
                  if num_processes > 1:
                      jax.distributed.initialize(
                          coordinator_address=coordinator,
                          num_processes=num_processes,
                          process_id=process_id,
                          initialization_timeout=300,
                      )

                  devices = jax.devices()
                  num_devices = len(devices)
                  print(f"[POD {process_id}] JAX distributed initialized! Devices ({num_devices}): {devices}", flush=True)
                  mesh = Mesh(devices, ('x',))

                  jit_gen = jax.jit(shard_map.shard_map(
                      generate_unstructured_2d,
                      mesh=mesh,
                      in_specs=P(),
                      out_specs=P('x', None),
                      check_rep=False,
                  ))
                  jit_ragged_sort = jax.jit(shard_map.shard_map(
                      ragged_exchange_and_sort,
                      mesh=mesh,
                      in_specs=P('x', None),
                      out_specs=(P('x'), P('x'), P('x', None)),
                      check_rep=False,
                  ))
                  jit_val = jax.jit(shard_map.shard_map(
                      validate_ragged, mesh=mesh, in_specs=(P('x'), P('x'), P('x', None)), out_specs=(P(), P(), P(), P()), check_rep=False
                  ))

                  total_keys = ELEMENTS_PER_CHIP * num_devices
                  total_gb = (total_keys * 8) / (1024**3)
                  ici_gb = (total_gb * (num_devices - 1)) / num_devices

                  for i, seed in enumerate([111, 222, 333]):
                      label = "COLD (incl. compile)" if i == 0 else f"WARM #{i} (steady-state)"
                      print(f"[POD {process_id}] Starting step {i}: {label} (seed={seed})...", flush=True)
                      trace_active = (i == 2)
                      if trace_active:
                          jax.profiler.start_trace("/tmp/xprof")

                      t0 = time.perf_counter()
                      raw_blocks = jit_gen(jnp.uint32(seed))
                      raw_blocks.block_until_ready()
                      t_gen = time.perf_counter() - t0

                      t1 = time.perf_counter()
                      sorted_keys, valid_cnt, sent_counts = jit_ragged_sort(raw_blocks)
                      sorted_keys.block_until_ready()
                      t_sort = time.perf_counter() - t1

                      passed, g_sum, g_count, chip0_send = jit_val(sorted_keys, valid_cnt, sent_counts)
                      passed.block_until_ready()
                      raw_blocks = None
                      if i < 2:
                          sorted_keys = None

                      if trace_active:
                          jax.profiler.stop_trace()

                      if process_id == 0:
                          ns_per_item = (t_sort * 1e9) / total_keys
                          chip0_send_list = [int(x) for x in chip0_send.tolist()]
                          print("=======================================================", flush=True)
                          print(f"[CASE B OPTIMIZED: 16 TPUv6e / {total_gb:.2f} GB] {label} (seed={seed})", flush=True)
                          print(f"Total Keys Generated/Conserved : {int(g_count):,} / {total_keys:,} ({total_gb:.2f} GB)", flush=True)
                          print(f"Chip 0 Variable Bucket Sizes   : {chip0_send_list}", flush=True)
                          print(f"Global Validation & Checksum   : [{'PASSED' if bool(passed) else 'FAILED'}] sum={int(g_sum)}", flush=True)
                          print(f"Phase 1 (Pallas Unstructured)  : {t_gen:.4f} s ({total_gb/t_gen:.2f} GB/s)", flush=True)
                          print(f"Phase 2 (RaggedA2A + Sort)     : {t_sort:.4f} s (ICI DMA: {ici_gb/t_sort:.2f} GB/s | {ns_per_item:.4f} ns/key)", flush=True)
                          print(f"End-to-End Latency             : {t_gen + t_sort:.4f} s ({total_gb/(t_gen + t_sort):.2f} GB/s)", flush=True)
                          print("=======================================================\n", flush=True)

                  if process_id == 0:
                      sample_blocks_shape = jax.ShapeDtypeStruct((num_devices * NUM_BLOCKS_PER_CHIP, BLOCK_WIDTH), jnp.uint64)
                      print_hardware_telemetry_report(jit_gen, jit_ragged_sort, jnp.uint32(333), sample_blocks_shape, jax.local_devices()[0])

                  try:
                      jax.distributed.shutdown()
                  except Exception:
                      pass

                  if process_id == 0:
                      print("Pod 0 holding /tmp/xprof and /tmp/xla_dump open for 20s so you can 'kubectl cp' them...", flush=True)
                      time.sleep(20)

              if __name__ == "__main__":
                  try:
                      main()
                  except Exception:
                      import traceback
                      traceback.print_exc()
                      raise
              EOF
              python3 -u /app/case_b_ragged_unstructured.py 2>&1
