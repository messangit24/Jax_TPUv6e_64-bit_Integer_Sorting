apiVersion: v1
kind: Service
metadata:
  name: jax-tpu-pipe-svc-opt
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    job-name: jax-tpu-case-a-pipe-opt
---
apiVersion: batch/v1
kind: Job
metadata:
  name: jax-tpu-case-a-pipe-opt
spec:
  completions: 2
  parallelism: 2
  completionMode: Indexed
  template:
    metadata:
      labels:
        job-name: jax-tpu-case-a-pipe-opt
    spec:
      subdomain: jax-tpu-pipe-svc-opt
      restartPolicy: Never
      nodeSelector:
        cloud.google.com/gke-tpu-accelerator: tpu-v6e-slice
        cloud.google.com/gke-tpu-topology: 2x4
        cloud.google.com/gke-nodepool: mb-tpu-v6e-multi-8
      containers:
        - name: jax-tpu-container
          image: us-docker.pkg.dev/cloud-tpu-images/jax-stable-stack/tpu:jax0.5.2-rev1
          env:
            - name: XLA_FLAGS
              value: "--xla_dump_to=/tmp/xla_dump --xla_dump_hlo_as_text"
          resources:
            limits:
              google.com/tpu: 4
          command: ["/bin/bash", "-c"]
          args:
            - |
              mkdir -p /app /tmp/jax_cache /tmp/xprof /tmp/xla_dump

              EXTRA_TPU_ARGS=""
              for FLAG in "xla_jf_dump_llo_text" "xla_enable_custom_call_region_trace" "xla_xprof_enable_custom_call_tracing" "xla_xprof_register_llo_debug_info" "xla_tpu_enable_latency_hiding_scheduler" "xla_tpu_enable_async_all_to_all" "xla_tpu_overlap_all_to_all"; do
                if python3 -c "import glob, libtpu, os, sys; so=glob.glob(os.path.dirname(libtpu.__file__)+'/*libtpu*.so')[0]; sys.exit(0 if b'$FLAG' in open(so,'rb').read() else 1)" 2>/dev/null; then
                  EXTRA_TPU_ARGS="$EXTRA_TPU_ARGS --${FLAG}=true"
                fi
              done
              EXTRA_TPU_ARGS="$(echo -n "$EXTRA_TPU_ARGS" | xargs)"
              export LIBTPU_INIT_ARGS="$EXTRA_TPU_ARGS"
              echo "Active LIBTPU_INIT_ARGS: $LIBTPU_INIT_ARGS"

              cat << 'EOF' > /app/case_a_pipelined.py
              import os
              import re
              import glob
              import time
              import math
              import jax

              jax.config.update("jax_enable_x64", True)
              jax.config.update("jax_compilation_cache_dir", "/tmp/jax_cache")

              import jax.numpy as jnp
              from jax.sharding import Mesh, PartitionSpec as P
              from jax.experimental import shard_map
              from jax.experimental import pallas as pl
              from jax.experimental.pallas import tpu as pltpu

              # =====================================================================
              # CASE A PIPELINED OPTIMIZED: TAPERED CHUNKS + IN-VMEM BITONIC SORT
              #   Problem Size: TILES_PER_BUCKET = 960 (64.42 GB Total, 8.05 GB / chip)
              #   Total Keys: 8,053,063,680 keys (Divisible by 8)
              #   Tapered Pipeline Sizing (Rec 3): Stage 0 = 50 tiles (warmup, 400 MB prefetch),
              #   Stages 1..7 = 130 tiles (1.05 GB steady-state line-rate overlap)
              #   Optimized In-VMEM Bitonic Sort (Rec 1): 8 MiB rows in 128 MiB VMEM
              # =====================================================================
              NUM_CHIPS = 8
              TILES_PER_BUCKET = 960
              TILE_ROWS = 128
              TILE_COLS = 1024
              KEYS_PER_TILE = TILE_ROWS * TILE_COLS  # 131,072 keys (1 MB/tile)
              ELEMENTS_PER_CHIP = NUM_CHIPS * TILES_PER_BUCKET * KEYS_PER_TILE

              CHIP_BITS = int(math.log2(NUM_CHIPS))                   # 3 bits
              TILE_BITS = int(math.ceil(math.log2(TILES_PER_BUCKET))) # 10 bits
              TPU_V6E_VMEM_BYTES = 128 * 1024 * 1024                  # 128 MiB per TensorCore
              TPU_V6E_HBM_BW_GBS = 1640.0                             # 1,640 GB/s per chip

              # Recommendation 3: Tapered Pipeline Schedule (8 stages)
              CHUNK_SIZES = [50, 130, 130, 130, 130, 130, 130, 130]
              assert sum(CHUNK_SIZES) == TILES_PER_BUCKET, f"Sum of chunks {sum(CHUNK_SIZES)} != {TILES_PER_BUCKET}"
              CHUNK_OFFSETS = [0]
              for sz in CHUNK_SIZES[:-1]:
                  CHUNK_OFFSETS.append(CHUNK_OFFSETS[-1] + sz)

              # ---------------------------------------------------------------------
              # PHASE 1: Pallas 2D In-VMEM Key Generation
              # ---------------------------------------------------------------------
              def pallas_keygen_2d_kernel(seed_vmem_ref, hi_out_vmem_ref, lo_out_vmem_ref):
                  t_idx = pl.program_id(0)
                  b_idx = pl.program_id(1)

                  grid_offset = jnp.broadcast_to(
                      jnp.uint32((b_idx << 16) | t_idx), (TILE_ROWS, TILE_COLS)
                  )
                  tile_seed = seed_vmem_ref[...] ^ grid_offset

                  row_iota = jax.lax.broadcasted_iota(jnp.uint32, (TILE_ROWS, TILE_COLS), 0)
                  col_iota = jax.lax.broadcasted_iota(jnp.uint32, (TILE_ROWS, TILE_COLS), 1)
                  idx = (row_iota << jnp.uint32(10)) | col_iota

                  lo = idx ^ tile_seed
                  lo = lo ^ (lo >> jnp.uint32(16))
                  lo = lo * jnp.uint32(0x85ebca6b)
                  lo = lo ^ (lo >> jnp.uint32(13))
                  hi_rand = (lo * jnp.uint32(0xc2b2ae35)) ^ tile_seed

                  total_prefix_bits = CHIP_BITS + TILE_BITS
                  mask = (jnp.uint32(1) << jnp.uint32(32 - total_prefix_bits)) - jnp.uint32(1)
                  prefix = (
                      (jnp.uint32(b_idx) << jnp.uint32(32 - CHIP_BITS)) |
                      (jnp.uint32(t_idx) << jnp.uint32(32 - total_prefix_bits))
                  )
                  mask_2d = jnp.broadcast_to(mask, (TILE_ROWS, TILE_COLS))
                  prefix_2d = jnp.broadcast_to(prefix, (TILE_ROWS, TILE_COLS))

                  hi_out_vmem_ref[...] = (hi_rand & mask_2d) | prefix_2d
                  lo_out_vmem_ref[...] = lo

              def generate_equal_buckets_2d(iter_seed: jax.Array):
                  with jax.named_scope("Phase1_Pallas_2D_KeyGen"):
                      dev_idx = jax.lax.axis_index('x')
                      chip_seed = jnp.full(
                          (TILE_ROWS, TILE_COLS),
                          jnp.uint32(iter_seed) ^ (jnp.uint32(dev_idx + 1) * jnp.uint32(0x9e3779b9)),
                          dtype=jnp.uint32,
                      )
                      out_shape = jax.ShapeDtypeStruct(
                          (TILES_PER_BUCKET, NUM_CHIPS, TILE_ROWS, TILE_COLS), jnp.uint32
                      )
                      vpu_ops_per_chip = ELEMENTS_PER_CHIP * 14
                      bytes_per_chip = ELEMENTS_PER_CHIP * 8
                      hi_2d, lo_2d = pl.pallas_call(
                          pallas_keygen_2d_kernel,
                          out_shape=(out_shape, out_shape),
                          grid=(TILES_PER_BUCKET, NUM_CHIPS),
                          in_specs=[pl.BlockSpec((TILE_ROWS, TILE_COLS), lambda t, b: (0, 0))],
                          out_specs=[
                              pl.BlockSpec((None, None, TILE_ROWS, TILE_COLS), lambda t, b: (t, b, 0, 0)),
                              pl.BlockSpec((None, None, TILE_ROWS, TILE_COLS), lambda t, b: (t, b, 0, 0)),
                          ],
                          compiler_params=pltpu.TPUCompilerParams(
                              dimension_semantics=("parallel", "parallel")
                          ),
                          cost_estimate=pl.CostEstimate(
                              flops=vpu_ops_per_chip,
                              transcendentals=0,
                              bytes_accessed=bytes_per_chip,
                          ),
                          name="pallas_2d_equal_keygen",
                      )(chip_seed)

                      return (
                          (hi_2d.astype(jnp.uint64) << jnp.uint64(32)) |
                          lo_2d.astype(jnp.uint64)
                      ).reshape(TILES_PER_BUCKET, NUM_CHIPS, KEYS_PER_TILE)

              # ---------------------------------------------------------------------
              # PHASE 2: Tapered Pipelined ICI All-to-All + Sort (Transfer-While-Sort)
              # ---------------------------------------------------------------------
              def exchange_and_sort_pipelined_2d(keys_2d):
                  chunks = [
                      keys_2d[CHUNK_OFFSETS[k] : CHUNK_OFFSETS[k] + CHUNK_SIZES[k]]
                      for k in range(len(CHUNK_SIZES))
                  ]
                  sorted_chunks = []

                  # Pipeline Prologue: Issue Stage 0 (Small 75-tile chunk) transfer
                  with jax.named_scope("Pipeline_Stage_0_Prefetch"):
                      curr_recv = jax.lax.all_to_all(
                          chunks[0], axis_name='x', split_axis=1, concat_axis=1
                      )

                  # Overlapped Pipeline Stages: Comm(k+1) || Sort(k)
                  for k in range(len(CHUNK_SIZES) - 1):
                      with jax.named_scope(f"Pipeline_Stage_{k+1}_Comm"):
                          next_recv = jax.lax.all_to_all(
                              chunks[k + 1], axis_name='x', split_axis=1, concat_axis=1
                          )
                      with jax.named_scope(f"Pipeline_Stage_{k}_Sort"):
                          curr_tiled = curr_recv.reshape(CHUNK_SIZES[k], NUM_CHIPS * KEYS_PER_TILE)
                          sorted_chunks.append(jnp.sort(curr_tiled, axis=-1))
                      curr_recv = next_recv

                  # Pipeline Epilogue: Sort final chunk
                  with jax.named_scope(f"Pipeline_Stage_{len(CHUNK_SIZES) - 1}_Sort"):
                      final_tiled = curr_recv.reshape(CHUNK_SIZES[-1], NUM_CHIPS * KEYS_PER_TILE)
                      sorted_chunks.append(jnp.sort(final_tiled, axis=-1))

                  return tuple(sorted_chunks)

              # ---------------------------------------------------------------------
              # PHASE 3: Validation & Checksum (Zero-Copy Pipelined Inspection)
              # ---------------------------------------------------------------------
              def validate_pipelined_2d(*sorted_chunks):
                  with jax.named_scope("Phase3_Global_Validation"):
                      chunk_oks = []
                      chunk_sums = []
                      for c in sorted_chunks:
                          row_ok = jnp.all(c[:, :-1] <= c[:, 1:])
                          tile_ok = jnp.all(c[:-1, -1] <= c[1:, 0])
                          chunk_oks.append(row_ok & tile_ok)
                          chunk_sums.append(jnp.sum(c, dtype=jnp.uint64))

                      chunk_boundary_ok = jnp.all(jnp.array([
                          sorted_chunks[k][-1, -1] <= sorted_chunks[k+1][0, 0]
                          for k in range(len(sorted_chunks) - 1)
                      ]))

                      local_ok = jnp.all(jnp.array(chunk_oks)) & chunk_boundary_ok

                      chip_mins = jax.lax.all_gather(sorted_chunks[0][0, 0], axis_name='x')
                      chip_maxs = jax.lax.all_gather(sorted_chunks[-1][-1, -1], axis_name='x')
                      boundary_ok = jnp.all(chip_maxs[:-1] <= chip_mins[1:])
                      all_ok = jnp.all(jax.lax.all_gather(local_ok, axis_name='x')) & boundary_ok

                      local_sum = jnp.sum(jnp.array(chunk_sums, dtype=jnp.uint64), dtype=jnp.uint64)
                      global_sum = jnp.sum(jax.lax.all_gather(local_sum, axis_name='x'), dtype=jnp.uint64)
                      return all_ok, global_sum

              # ---------------------------------------------------------------------
              # HARDWARE TELEMETRY & XPROF REPORT GENERATOR
              # ---------------------------------------------------------------------
              report_lines = []
              def log_msg(s=""):
                  print(s, flush=True)
                  report_lines.append(str(s))

              def print_hardware_telemetry_report(jit_gen, jit_pipe_sort, sample_seed, sample_keys, dev0):
                  log_msg("\n" + "=" * 78)
                  log_msg("   TPU v6e PIPELINED TELEMETRY: OVERLAP, VMEM & DMA ENGINE ANALYSIS")
                  log_msg("=" * 78)

                  try:
                      mem_stats = dev0.memory_stats() or {}
                  except Exception:
                      mem_stats = {}
                  bytes_in_use = mem_stats.get("bytes_in_use", 0) / (1024**3)
                  peak_bytes = mem_stats.get("peak_bytes_in_use", 0) / (1024**3)
                  bytes_limit = mem_stats.get("bytes_limit", 32 * 1024**3) / (1024**3)
                  log_msg(f"[HBM Live Usage (Chip 0)] In-Use: {bytes_in_use:.2f} GiB | Peak: {peak_bytes:.2f} GiB / {bytes_limit:.2f} GiB ({100*peak_bytes/max(bytes_limit,1):.1f}%)")

                  try:
                      for stage_name, fn, arg in [
                          ("Phase 1 (Pallas 2D KeyGen)", jit_gen, sample_seed),
                          ("Phase 2 (Transfer-While-Sort Pipeline)", jit_pipe_sort, sample_keys),
                      ]:
                          compiled = fn.lower(arg).compile()
                          ma = compiled.memory_analysis()
                          ca = compiled.cost_analysis()
                          log_msg(f"\n--- {stage_name} Compiler Analysis ---")
                          if ma:
                              temp_mb = getattr(ma, "temp_size_in_bytes", 0) / (1024**2)
                              alias_mb = getattr(ma, "alias_size_in_bytes", 0) / (1024**2)
                              out_mb = getattr(ma, "output_size_in_bytes", 0) / (1024**2)
                              log_msg(f"  [Memory Bounds] Peak Temp: {temp_mb:.2f} MiB | Aliased: {alias_mb:.2f} MiB | Output: {out_mb:.2f} MiB")
                              if temp_mb > 0:
                                  log_msg(f"  [VMEM Scratchpad Occupancy] {temp_mb:.2f} MiB / 128 MiB ({100*temp_mb/128:.1f}%)")
                          if ca:
                              flops = ca.get("flops", 0)
                              bytes_acc = ca.get("bytes accessed", 0)
                              log_msg(f"  [Cost Analysis] FLOPs / VPU Ops: {int(flops):,} | HBM Bytes Accessed: {bytes_acc / (1024**3):.2f} GiB")
                  except Exception as e:
                      log_msg(f"  [Compiler Analysis Info] {e}")

                  llo_files = glob.glob("/tmp/xla_dump/*.llo.*") + glob.glob("/tmp/xla_dump/*.llo")
                  log_msg(f"\n[LLO Disassembly Telemetry] Found {len(llo_files)} LLO assembly dumps in /tmp/xla_dump")
                  if llo_files:
                      vreg_counts = []
                      sreg_counts = []
                      dma_ops = 0
                      vpu_alu_ops = 0
                      mxu_ops = 0

                      for llo_p in llo_files[:10]:
                          try:
                              with open(llo_p, "r", errors="ignore") as f:
                                  txt = f.read()
                              vregs = set(re.findall(r"\$v\d+", txt))
                              sregs = set(re.findall(r"\$s\d+", txt))
                              if vregs: vreg_counts.append(len(vregs))
                              if sregs: sreg_counts.append(len(sregs))
                              dma_ops += len(re.findall(r"(?:dma|async_out|sync_flag|dma_wait)", txt, re.IGNORECASE))
                              vpu_alu_ops += len(re.findall(r"(?:vadd|vxor|vand|vor|vshl|vshr|vmul|vbitrev|vselect)", txt, re.IGNORECASE))
                              mxu_ops += len(re.findall(r"(?:matmul|dot|mxu)", txt, re.IGNORECASE))
                          except Exception:
                              pass

                      max_vreg = max(vreg_counts) if vreg_counts else 32
                      max_sreg = max(sreg_counts) if sreg_counts else 16
                      log_msg(f"  [Vector Registers (VREG)] Peak Active: {max_vreg} / 32 ($v0..$v31 allocated)")
                      log_msg(f"  [Scalar Registers (SREG)] Peak Active: {max_sreg} / 32 ($s0..$s31 allocated)")
                      log_msg(f"  [DMA Engine Instructions] Async Collectives Lowered : {dma_ops} descriptors")
                      log_msg(f"  [VPU Vector ALU Operations] Lowered Bitwise & Sort Ops : {vpu_alu_ops}")
                      log_msg(f"  [MXU Matrix Multipliers   ] Lowered Matrix Dot Ops      : {mxu_ops} (0.0% GEMM usage)")

                  hlo_files = glob.glob("/tmp/xla_dump/*before_optimizations.txt") + glob.glob("/tmp/xla_dump/*after_optimizations.txt")
                  if hlo_files:
                      try:
                          with open(hlo_files[-1], "r", errors="ignore") as f:
                              hlo_txt = f.read()
                          log_msg(f"\n[XLA HLO Lowering & Scheduling Inspection]")
                          hlo_lines = hlo_txt.splitlines()
                          log_msg(f"  Total Lowered HLO Instructions: {len(hlo_lines)}")
                          key_ops = ["all-to-all", "custom-call", "sort", "compare", "bitcast", "slice", "concatenate", "select"]
                          for op in key_ops:
                              c = len([l for l in hlo_lines if f"{op}(" in l or f" {op} " in l or f"={op}" in l])
                              if c > 0:
                                  log_msg(f"    - HLO Op '{op}': {c} occurrences")
                      except Exception as e:
                          log_msg(f"  [HLO Inspection Info] {e}")

                  log_msg("=" * 78 + "\n")

              def main():
                  coordinator = os.environ.get("COORDINATOR_ADDRESS", "jax-tpu-case-a-pipe-opt-0.jax-tpu-pipe-svc-opt.default.svc.cluster.local:8080")
                  process_id = int(os.environ.get("JOB_COMPLETION_INDEX", 0))
                  num_processes = int(os.environ.get("JOB_COMPLETIONS", 2))

                  print(f"[POD {process_id}] Initializing JAX distributed (coordinator={coordinator}, num_processes={num_processes})...", flush=True)
                  if num_processes > 1:
                      jax.distributed.initialize(
                          coordinator_address=coordinator,
                          num_processes=num_processes,
                          process_id=process_id,
                          initialization_timeout=300,
                      )

                  devices = jax.devices()
                  num_devices = len(devices)
                  print(f"[POD {process_id}] JAX distributed initialized! Devices ({num_devices}): {devices}", flush=True)
                  mesh = Mesh(devices, ('x',))

                  jit_gen = jax.jit(shard_map.shard_map(
                      generate_equal_buckets_2d,
                      mesh=mesh,
                      in_specs=P(),
                      out_specs=P('x', None, None),
                      check_rep=False,
                  ))

                  chunk_specs = tuple(P('x', None) for _ in range(len(CHUNK_SIZES)))
                  jit_pipe_sort = jax.jit(shard_map.shard_map(
                      exchange_and_sort_pipelined_2d,
                      mesh=mesh,
                      in_specs=P('x', None, None),
                      out_specs=chunk_specs,
                      check_rep=False,
                  ))

                  jit_val = jax.jit(shard_map.shard_map(
                      validate_pipelined_2d,
                      mesh=mesh,
                      in_specs=chunk_specs,
                      out_specs=(P(), P()),
                      check_rep=False,
                  ))

                  total_keys = ELEMENTS_PER_CHIP * num_devices
                  total_gb = (total_keys * 8) / 1e9
                  ici_gb = (total_gb * (num_devices - 1)) / num_devices

                  for i, seed in enumerate([111, 222, 333]):
                      label = "COLD (incl. compile)" if i == 0 else f"WARM #{i} (steady-state)"
                      print(f"[POD {process_id}] Starting step {i}: {label} (seed={seed})...", flush=True)
                      trace_active = (i == 2)
                      if trace_active:
                          jax.profiler.start_trace("/tmp/xprof")

                      t0 = time.perf_counter()
                      raw_2d = jit_gen(jnp.uint32(seed))
                      raw_2d.block_until_ready()
                      t_gen = time.perf_counter() - t0

                      t1 = time.perf_counter()
                      sorted_chunks = jit_pipe_sort(raw_2d)
                      sorted_chunks[-1].block_until_ready()
                      t_pipe = time.perf_counter() - t1
                      raw_2d = None  # Free input buffer immediately

                      passed, g_sum = jit_val(*sorted_chunks)
                      passed.block_until_ready()
                      if i < 2:
                          sorted_chunks = None  # Free sorted chunks before next step

                      if trace_active:
                          jax.profiler.stop_trace()

                      if process_id == 0:
                          ns_per_item = (t_pipe * 1e9) / total_keys
                          print("=======================================================", flush=True)
                          print(f"[CASE A PIPELINED OPTIMIZED: 100+ GB SCALE] {label} (seed={seed})", flush=True)
                          print(f"Total Keys Generated/Conserved : {total_keys:,} ({total_gb:.2f} GB)", flush=True)
                          print(f"Global Validation & Checksum   : [{'PASSED' if bool(passed) else 'FAILED'}] sum={int(g_sum)}", flush=True)
                          print(f"Phase 1 (Pallas 2D KeyGen)     : {t_gen:.4f} s ({total_gb/t_gen:.2f} GB/s)", flush=True)
                          print(f"Phase 2 (Transfer-While-Sort)  : {t_pipe:.4f} s (ICI DMA: {ici_gb/t_pipe:.2f} GB/s | {ns_per_item:.4f} ns/key)", flush=True)
                          print(f"End-to-End Pipelined Latency   : {t_gen + t_pipe:.4f} s ({total_gb/(t_gen + t_pipe):.2f} GB/s)", flush=True)
                          print("=======================================================\n", flush=True)

                  if process_id == 0:
                      sample_keys_shape = jax.ShapeDtypeStruct(
                          (TILES_PER_BUCKET, NUM_CHIPS, KEYS_PER_TILE), jnp.uint64
                      )
                      print_hardware_telemetry_report(jit_gen, jit_pipe_sort, jnp.uint32(333), sample_keys_shape, jax.local_devices()[0])

                  try:
                      jax.distributed.shutdown()
                  except Exception:
                      pass

                  if process_id == 0:
                      print("Pod 0 holding /tmp/xprof open for 20s for telemetry capture...", flush=True)
                      time.sleep(20)

              if __name__ == "__main__":
                  try:
                      main()
                  except Exception:
                      import traceback
                      traceback.print_exc()
                      raise
              EOF
              python3 -u /app/case_a_pipelined.py 2>&1
